name: Compilar PixelMatte (Windows y Linux)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter rembg pillow numpy opencv-python pyinstaller

    - name: Compilar con PyInstaller (Windows)
      run: |
        pyinstaller --noconsole --onefile --name="PixelMatte" --add-data "assets;assets" --collect-all rembg --collect-all onnxruntime PixelMatte.py

    - name: Subir artefacto Windows (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: PixelMatte-Windows-EXE
        path: dist/PixelMatte.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias del sistema (Tkinter y FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 python3-tk

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter rembg pillow numpy opencv-python pyinstaller

    - name: Compilar con PyInstaller (Linux)
      run: |
        pyinstaller --noconsole --onefile --name="PixelMatte" --add-data "assets:assets" --collect-all rembg --collect-all onnxruntime PixelMatte.py

    - name: Subir artefacto Linux
      uses: actions/upload-artifact@v4
      with:
        name: PixelMatte-Linux-Binary
        path: dist/PixelMatte
