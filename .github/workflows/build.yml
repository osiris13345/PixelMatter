name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python pillow tkinterdnd2 "rembg[cpu]" numpy pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --collect-all rembg --collect-all onnxruntime --collect-all tkinterdnd2 PixelMatte.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PixelMatte-Windows-EXE
        path: dist/PixelMatte.exe
