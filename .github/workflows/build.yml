name: Compilar PixelMatte a EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter rembg pillow numpy opencv-python pyinstaller

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="PixelMatte" --add-data "assets;assets" PixelMatte.py

    - name: Subir artefacto (Ejecutable)
      uses: actions/upload-artifact@v4
      with:
        name: PixelMatte-Windows-EXE
        path: dist/PixelMatte.exe
