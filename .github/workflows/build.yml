name: Compilar PixelMatte (Windows y Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Actualizar pip y herramientas
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Instalar dependencias del proyecto
      run: |
        pip install customtkinter pillow rembg opencv-python moviepy imageio-ffmpeg tkinterdnd2 requests

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --noconsole --onefile --hidden-import=moviepy --hidden-import=moviepy.video.io.VideoFileClip --hidden-import=imageio_ffmpeg --hidden-import=rembg --hidden-import=onnxruntime PixelMatter_2.py

    - name: Subir artefacto ejecutable Windows
      uses: actions/upload-artifact@v4
      with:
        name: PixelMatte-Windows-Portable
        path: dist/*.exe
